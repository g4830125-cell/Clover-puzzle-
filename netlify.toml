# Netlify configuration for ManaGrid
# This file helps make the frontend deployment-independent by providing a proxy
# to the backend, allowing the frontend to use relative paths.

[build]
  publish = "dist"
  command = "npm run build"

# Example Proxy Configuration
# To use this, replace the URL with your actual backend URL (e.g. from Google Cloud Run)
# Once set up, the app will work seamlessly on any Netlify domain/branch/PR preview.

# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service-url.a.run.app/api/:splat"
#   status = 200

# [[redirects]]
#   from = "/socket.io/*"
#   to = "https://your-backend-service-url.a.run.app/socket.io/:splat"
#   status = 200

# If you prefer NOT to use a proxy, simply set the VITE_API_URL 
# environment variable in your Netlify site settings.
