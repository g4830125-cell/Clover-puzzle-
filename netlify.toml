# Netlify configuration for ManaGrid
# This file helps make the frontend deployment-independent by providing a proxy
# to the backend, allowing the frontend to use relative paths.

[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Ensures and React Router paths work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy example for your backend (optional)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.a.run.app/api/:splat"
#   status = 200
